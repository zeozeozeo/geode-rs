[package]
name = "geode-rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = ["bindgen"]
bindgen = ["dep:bindgen"]

[dependencies]
ctor = { version = "1.0.13", default-features = false, features = ["proc_macro"] }
geode-macros = { path = "../geode-macros" }
stl-core = { path = "../stl-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[build-dependencies]
geode-codegen = { path = "../geode-codegen" }
glob = "0.3"
anyhow = "1.0"
bindgen = { version = "0.73", optional = true }
regex = "1.13"
